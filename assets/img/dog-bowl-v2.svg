<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Dog silhouette standing beside a food bowl">
  <!-- soft backdrop -->
  <circle cx="200" cy="150" r="146" fill="#fff4b8"/>
  <!-- ground line, behind the figures -->
  <rect x="30" y="212" width="340" height="4" rx="2" fill="#bfe0f5"/>
  <g fill="#35597a">
    <!-- standing dog: head, snout, ear -->
    <circle cx="170" cy="100" r="26"/>
    <rect x="186" y="96" width="30" height="18" rx="9"/>
    <path d="M150 92 Q138 100 142 126 Q150 130 156 118 Q156 104 158 92 Z"/>
    <!-- neck and body -->
    <path d="M138 112 L180 112 L170 150 L134 150 Z"/>
    <rect x="50" y="124" width="124" height="54" rx="27"/>
    <!-- legs -->
    <rect x="136" y="164" width="14" height="44" rx="6"/>
    <rect x="154" y="164" width="14" height="44" rx="6"/>
    <rect x="60" y="164" width="14" height="44" rx="6"/>
    <rect x="78" y="164" width="14" height="44" rx="6"/>
    <!-- bowl -->
    <rect x="226" y="190" width="136" height="12" rx="6"/>
    <path d="M236 200 H352 Q346 250 294 256 Q242 250 236 200 Z"/>
    <!-- food: meat, carrot, leaf and bone -->
    <rect x="240" y="170" width="24" height="20" rx="8"/>
    <rect x="270" y="160" width="26" height="22" rx="8"/>
    <rect x="304" y="168" width="24" height="20" rx="8"/>
    <path d="M284 172 Q302 166 318 150 Q314 172 300 182 Z"/>
    <ellipse cx="262" cy="150" rx="9" ry="5" transform="rotate(-30 262 150)"/>
    <g transform="translate(318 134) rotate(-20) scale(0.4)">
      <rect x="18" y="14" width="64" height="12" rx="4"/>
      <circle cx="18" cy="11" r="8"/>
      <circle cx="18" cy="29" r="8"/>
      <circle cx="82" cy="11" r="8"/>
      <circle cx="82" cy="29" r="8"/>
    </g>
  </g>
</svg>
