<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-label="Cute cartoon dog sitting beside a bowl of kibble">
  <!-- soft backdrop -->
  <circle cx="180" cy="150" r="138" fill="#fff4b8"/>
  <circle cx="58" cy="60" r="7" fill="#bfe0f5"/>
  <circle cx="312" cy="72" r="6" fill="#bfe0f5"/>
  <circle cx="300" cy="250" r="9" fill="#ffe27a"/>

  <!-- dog body -->
  <ellipse cx="128" cy="222" rx="60" ry="48" fill="#f9d9a0"/>
  <!-- front paws -->
  <ellipse cx="104" cy="262" rx="20" ry="13" fill="#f9d9a0"/>
  <ellipse cx="150" cy="262" rx="20" ry="13" fill="#f9d9a0"/>
  <!-- tail -->
  <path d="M184 218 Q212 200 202 176" fill="none" stroke="#f9d9a0" stroke-width="14" stroke-linecap="round"/>

  <!-- ears -->
  <ellipse cx="78" cy="118" rx="22" ry="36" fill="#eab07a" transform="rotate(14 78 118)"/>
  <ellipse cx="182" cy="118" rx="22" ry="36" fill="#eab07a" transform="rotate(-14 182 118)"/>
  <!-- head -->
  <circle cx="130" cy="130" r="62" fill="#f9d9a0"/>
  <!-- muzzle -->
  <ellipse cx="130" cy="160" rx="28" ry="21" fill="#fff8e6"/>

  <!-- big happy eyes -->
  <circle cx="106" cy="124" r="11" fill="#ffffff"/>
  <circle cx="154" cy="124" r="11" fill="#ffffff"/>
  <circle cx="108" cy="126" r="7" fill="#4a3b2f"/>
  <circle cx="156" cy="126" r="7" fill="#4a3b2f"/>
  <circle cx="110" cy="123" r="2.5" fill="#ffffff"/>
  <circle cx="158" cy="123" r="2.5" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="90" cy="146" rx="9" ry="6" fill="#ffb3b3" opacity="0.75"/>
  <ellipse cx="170" cy="146" rx="9" ry="6" fill="#ffb3b3" opacity="0.75"/>

  <!-- nose and smile -->
  <ellipse cx="130" cy="150" rx="8" ry="6" fill="#4a3b2f"/>
  <path d="M120 164 Q130 174 140 164" fill="none" stroke="#4a3b2f" stroke-width="3" stroke-linecap="round"/>
  <path d="M124 170 Q130 182 136 170 Z" fill="#ffa0b4"/>

  <!-- collar and heart tag -->
  <path d="M84 196 Q130 216 176 196" fill="none" stroke="#bfe0f5" stroke-width="12" stroke-linecap="round"/>
  <path d="M130 222 c-4 -6 -12 -2 -8 5 l8 7 l8 -7 c4 -7 -4 -11 -8 -5 Z" fill="#ffe27a" stroke="#f2bd16" stroke-width="1.5"/>

  <!-- food bowl -->
  <path d="M236 196 H330 Q326 250 283 254 Q240 250 236 196 Z" fill="#bfe0f5"/>
  <ellipse cx="283" cy="196" rx="47" ry="11" fill="#ffe27a"/>
  <!-- kibble -->
  <g fill="#c98a4b">
    <circle cx="266" cy="192" r="5"/>
    <circle cx="282" cy="188" r="5"/>
    <circle cx="298" cy="193" r="5"/>
    <circle cx="274" cy="198" r="5"/>
    <circle cx="292" cy="199" r="5"/>
  </g>
  <!-- sparkles -->
  <path d="M283 150 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z" fill="#ffe27a"/>
  <path d="M242 160 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#bfe0f5"/>
</svg>
