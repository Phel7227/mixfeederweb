<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Cartoon silhouette of a dog running toward you with a food bowl in its mouth">
  <!-- backdrop and ground, in pale yellows -->
  <circle cx="200" cy="150" r="146" fill="#fff6cc"/>
  <ellipse cx="200" cy="284" rx="150" ry="13" fill="#ffe57a"/>

  <!-- tail, golden -->
  <path d="M250 160 Q280 138 270 92" fill="none" stroke="#ffd23f" stroke-width="14" stroke-linecap="round"/>

  <!-- far legs, deeper yellow, behind the body -->
  <g fill="#ffbe0b">
    <rect x="138" y="236" width="18" height="46" rx="8" transform="rotate(-8 147 259)"/>
    <rect x="236" y="236" width="18" height="46" rx="8" transform="rotate(8 245 259)"/>
  </g>

  <!-- body and near legs, golden -->
  <g fill="#ffd23f">
    <path d="M156 150 Q200 136 244 150 Q258 210 250 262 Q248 280 230 280 H170 Q152 280 152 262 Q150 200 156 150 Z"/>
    <rect x="168" y="238" width="18" height="46" rx="8"/>
    <rect x="214" y="234" width="18" height="48" rx="8"/>
  </g>

  <!-- head with round floppy-tip ears -->
  <g fill="#ffd23f">
    <ellipse cx="160" cy="62" rx="15" ry="27" transform="rotate(-24 160 62)"/>
    <ellipse cx="240" cy="62" rx="15" ry="27" transform="rotate(24 240 62)"/>
    <circle cx="200" cy="100" r="50"/>
    <ellipse cx="200" cy="130" rx="30" ry="24"/>
  </g>
  <ellipse cx="160" cy="62" rx="7" ry="14" transform="rotate(-24 160 62)" fill="#ffbe0b"/>
  <ellipse cx="240" cy="62" rx="7" ry="14" transform="rotate(24 240 62)" fill="#ffbe0b"/>
  <!-- eyes and nose -->
  <circle cx="182" cy="96" r="6" fill="#fff6cc"/>
  <circle cx="218" cy="96" r="6" fill="#fff6cc"/>
  <ellipse cx="200" cy="120" rx="8" ry="6" fill="#ffb703"/>

  <!-- food bowl held in the mouth, deeper yellow -->
  <ellipse cx="200" cy="170" rx="68" ry="46" fill="#ffb703"/>
  <ellipse cx="200" cy="166" rx="57" ry="36" fill="#fff6cc"/>
  <ellipse cx="200" cy="170" rx="40" ry="22" fill="#ffe57a"/>
</svg>
