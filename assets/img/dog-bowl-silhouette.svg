<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Dog silhouette beside a dog food bowl with meat, vegetables and a bone">
  <!-- soft backdrop -->
  <circle cx="200" cy="160" r="148" fill="#fff4b8"/>

  <!-- dog, silhouette only -->
  <g transform="translate(12 36) scale(1.45)" fill="#35597a">
    <circle cx="66" cy="30" r="17"/>
    <rect x="76" y="25" width="22" height="13" rx="6.5"/>
    <path d="M54 22 Q44 26 46 46 Q50 52 56 46 Q58 34 62 24 Z"/>
    <rect x="56" y="40" width="18" height="24" rx="7"/>
    <ellipse cx="62" cy="74" rx="20" ry="30"/>
    <ellipse cx="44" cy="86" rx="17" ry="20"/>
    <rect x="64" y="92" width="10" height="24" rx="4"/>
    <ellipse cx="44" cy="107" rx="14" ry="6"/>
    <path d="M34 84 Q12 80 16 58" fill="none" stroke="#35597a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- food: meat chunks, carrots and greens -->
  <g>
    <rect x="232" y="146" width="22" height="16" rx="6" fill="#e98a84"/>
    <rect x="262" y="134" width="24" height="18" rx="7" fill="#e98a84"/>
    <rect x="296" y="140" width="22" height="16" rx="6" fill="#e98a84"/>
    <rect x="326" y="130" width="24" height="18" rx="7" fill="#e98a84"/>
    <circle cx="250" cy="150" r="7" fill="#f7b267"/>
    <circle cx="250" cy="150" r="3" fill="#ffe0b8"/>
    <circle cx="314" cy="146" r="7" fill="#f7b267"/>
    <circle cx="314" cy="146" r="3" fill="#ffe0b8"/>
    <ellipse cx="282" cy="140" rx="8" ry="5" transform="rotate(-30 282 140)" fill="#8ccf9b"/>
    <ellipse cx="344" cy="146" rx="8" ry="5" transform="rotate(30 344 146)" fill="#8ccf9b"/>
    <ellipse cx="268" cy="126" rx="6" ry="4" transform="rotate(-20 268 126)" fill="#8ccf9b"/>
    <!-- bone resting on the food -->
    <g transform="translate(326 110) rotate(-18) scale(0.5)" fill="#ffd84d">
      <rect x="18" y="14" width="64" height="12" rx="4"/>
      <circle cx="18" cy="11" r="8"/>
      <circle cx="18" cy="29" r="8"/>
      <circle cx="82" cy="11" r="8"/>
      <circle cx="82" cy="29" r="8"/>
    </g>
  </g>

  <!-- dog food bowl -->
  <path d="M212 170 H378 Q372 246 295 252 Q218 246 212 170 Z" fill="#35597a"/>
  <rect x="262" y="250" width="66" height="8" rx="4" fill="#35597a"/>
  <ellipse cx="295" cy="170" rx="83" ry="10" fill="#4a72a0"/>
  <!-- bone emblem on the bowl -->
  <g transform="translate(295 212) scale(0.38) translate(-50 -20)" fill="#ffe27a">
    <rect x="18" y="14" width="64" height="12" rx="4"/>
    <circle cx="18" cy="11" r="8"/>
    <circle cx="18" cy="29" r="8"/>
    <circle cx="82" cy="11" r="8"/>
    <circle cx="82" cy="29" r="8"/>
  </g>

  <!-- small decorative bones -->
  <g transform="translate(92 44) rotate(-12) scale(0.28) translate(-50 -20)" fill="#bfe0f5">
    <rect x="18" y="14" width="64" height="12" rx="4"/>
    <circle cx="18" cy="11" r="8"/>
    <circle cx="18" cy="29" r="8"/>
    <circle cx="82" cy="11" r="8"/>
    <circle cx="82" cy="29" r="8"/>
  </g>
  <circle cx="372" cy="60" r="5" fill="#bfe0f5"/>
  <circle cx="352" cy="44" r="3" fill="#ffe27a"/>
</svg>
