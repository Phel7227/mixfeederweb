<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixFeeder Ingredients</title>
<meta name="description" content="Type the amount of any one ingredient and see the rest of the raw recipe adjust to the same ratio. A guide only.">
<link rel="stylesheet" href="assets/css/style.css?v=2026110505">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-nav">

    <a class="site-nav-brand" href="index.html">MixFeeder <span>Calculator</span></a>
    <nav aria-label="Main">
      <ul class="site-nav-links">
        <li><a href="index.html">Calculator</a></li>
        <li><a href="ingredient.html" aria-current="page">Ingredients</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main">
<section class="hero hero-compact">
  <div class="container hero-inner">
    <div>
      <h1>Ingredient amounts</h1>
      <p>Type an amount in any row. The other rows change to keep the same ratio for the feeding style you choose.</p>
    </div>
  </div>
</section>
<section class="section ingredient-page">
  <div class="container">
    <div class="ingredient-controls">
      <div class="field">
        <label for="ingredient-style">Feeding style</label>
        <select id="ingredient-style"></select>
      </div>
      <p class="ingredient-total" id="ingredient-total" aria-live="polite"></p>
    </div>
    <p class="field-error" id="ingredient-error" role="alert"></p>
    <ul class="ingredient-list" id="ingredient-list"></ul>

  </div>

</main>
<script src="assets/js/feeding-config.js?v=2026110505"></script>
